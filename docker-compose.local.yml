services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8001:8000"  # Map host port 8001 to container port 8000
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    volumes:
      - ./dynamodb-data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    networks:
      - local-dev

  infra-cli-runner:
    build:
      context: ./infra-cli-runner
      dockerfile: Dockerfile.railway
    container_name: infra-cli-runner
    ports:
      - "${LOCAL_CLI_RUNNER_PORT:-8002}:8080"
    environment:
      CLI_RUNNER_SHARED_TOKEN: "${LOCAL_CLI_RUNNER_SHARED_TOKEN:-local-cli-runner-token}"
      CLI_RUNNER_MAX_TIMEOUT_SECONDS: "${LOCAL_CLI_RUNNER_MAX_TIMEOUT_SECONDS:-120}"
      PORT: "8080"
    networks:
      - local-dev

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-local
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - local-dev

  ollama-model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull qwen3-embedding:0.6b &&
        ollama run qwen3-embedding:0.6b "local readiness check" >/dev/null
    restart: "no"
    networks:
      - local-dev

  pinecone-index:
    image: ghcr.io/pinecone-io/pinecone-index:latest
    platform: linux/amd64
    container_name: pinecone-index-local
    environment:
      PORT: "5081"
      INDEX_TYPE: serverless
      VECTOR_TYPE: dense
      DIMENSION: "1024"
      METRIC: cosine
    ports:
      - "5081:5081"
    networks:
      - local-dev

volumes:
  ollama-data:

networks:
  local-dev:
    driver: bridge
