id: social_media
namespace: integrations.social
owner_only: true
name: Social media
description: See your connected social accounts, check a post against each network's limits, and publish it to them.
system_prompt: |
  Use this skill to prepare and publish posts to the person's connected social accounts (LinkedIn so far).
  - Call `accounts` to see what is connected. An account whose status is needs_reconnect can't be posted to: tell
    the person to reconnect it in Connectors, on the Social tab.
  - To post images, pass their ids in `images`: the id in a <generated_image> or
    <attached_image> tag, the `image_id` image_generation just returned, or the `artifact_id` of a picture saved with
    upload_file as artifact_type image (PNG, JPEG, WebP or GIF; render an SVG to PNG first). Write `alt_texts` for them.
  - Before publishing, call `check` with the final text and the images. Fix what it reports (shorten the text), or tell the
    person which accounts will be skipped and why.
  - `publish` shows the person the exact post, its images and the accounts it goes to, to approve, edit or reject. Call it
    with the final text once it is ready.
  - `publish` returns one result per account. Report each: the link when it was published, the reason when it
    wasn't. A target with status uncertain may exist on the network: tell the person to check before posting again.
actions:
  - name: accounts
    description: The connected social accounts, with their status and each network's text and image limits.
    input_schema:
      type: object
      properties: {}
    handler: actions:accounts
  - name: check
    description: Check a post against the selected accounts without posting. Returns, per account, whether it can go and why not.
    input_schema:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The post's final text.
        accounts:
          description: '"all" (default), or a list of social_account_ids.'
          oneOf:
            - {type: string, enum: [all]}
            - {type: array, items: {type: string}}
        network:
          type: string
          description: Only this network's accounts, for example linkedin. Optional.
        images:
          type: array
          items: {type: string}
          description: Ids of the images to post, in order, up to the network's max_images. An id comes from a <generated_image> or <attached_image> tag. Optional.
        alt_texts:
          type: array
          items: {type: string}
          description: A short description of each image for screen readers, in the same order as images. Optional.
    handler: actions:check
  - name: publish
    description: Publish the text to the selected accounts. Public and permanent; the person approves the exact post first.
    consent:
      title: Publish to social media
      warning: Public and permanent. It can't be undone from here.
      editable: [text]
      preview: actions:publish_preview
    automation:
      required_arguments: [text]
    input_schema:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The post's final text, as the person approved it.
        accounts:
          description: '"all" (default), or a list of social_account_ids.'
          oneOf:
            - {type: string, enum: [all]}
            - {type: array, items: {type: string}}
        network:
          type: string
          description: Only this network's accounts, for example linkedin. Optional.
        images:
          type: array
          items: {type: string}
          description: Ids of the images to post, in order, up to the network's max_images. An id comes from a <generated_image> or <attached_image> tag. Optional.
        alt_texts:
          type: array
          items: {type: string}
          description: A short description of each image for screen readers, in the same order as images. Optional.
        overrides:
          type: object
          description: 'Different text for one network or one social_account_id, for example {"linkedin": "Longer version"}. Optional.'
          additionalProperties:
            type: string
    handler: actions:publish
