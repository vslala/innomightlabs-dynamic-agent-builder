id: google_drive
namespace: integrations.google
name: Google Drive
description: Search, read, create, update, and trash files in the connected Google Drive account.
system_prompt: |
  Use this skill to inspect or manage files in Google Drive.
  Always load the skill first, then call the most specific action.
  Prefer `search` with structured filters when the user is trying to browse folders or narrow to a specific file.

  Example usages:
  - Find a likely folder named "Personal":
    action=search
    arguments={"mode":"search","query":"Personal","entry_type":"folders","order_by":"name"}
  - List direct child folders inside a known folder:
    action=search
    arguments={"mode":"children","parent_folder_id":"<folder_id>","entry_type":"folders","order_by":"name"}
  - List direct child files inside a known folder:
    action=search
    arguments={"mode":"children","parent_folder_id":"<folder_id>","entry_type":"files","order_by":"name"}
  - Recursively walk a folder tree when files may be nested:
    action=search
    arguments={"mode":"children","parent_folder_id":"<folder_id>","entry_type":"files","recursive":true,"page_size":20}
  - Diagnose why a folder appears empty:
    action=search
    arguments={"mode":"children","parent_folder_id":"<folder_id>","entry_type":"any","diagnostics":true}
  - Find an exact file name:
    action=search
    arguments={"mode":"search","query":"budget-2025.pdf","exact_name":true,"entry_type":"files"}
  - Read a file after locating its id:
    action=read
    arguments={"file_id":"<file_id>"}
  - Create a text file in a folder:
    action=create
    arguments={"name":"notes.txt","content":"Meeting notes","parent_folder_id":"<folder_id>"}
  - Create a Google Doc by importing plain text:
    action=create
    arguments={"name":"Meeting notes","mime_type":"application/vnd.google-apps.document","content":"Meeting notes"}
  - Replace a text file's entire content:
    action=update
    arguments={"file_id":"<file_id>","content":"Replacement text"}
  - Rename a file (including a Google Doc or folder):
    action=update
    arguments={"file_id":"<file_id>","name":"New name","description":"Updated description"}
  - Move a file to trash:
    action=delete
    arguments={"file_id":"<file_id>"}

  Notes:
  - `create` supports UTF-8 text-like files (default text/plain), Google Docs through plain-text import, and folders (application/vnd.google-apps.folder, no content).
  - `update` (alias `modify`) replaces the WHOLE content of stored text-like files only. Empty content clears a text file; empty description clears its description.
  - Never use Drive media update to edit Google Docs, Sheets, Slides, or other native/binary content. Native files support metadata-only updates here; use a dedicated editor for their bodies.
  - Parent folder selection is supported on creation only. File moves, MIME type changes, binary uploads, and partial/append edits are not supported.
  - Use `entry_type="folders"` when the user is looking for folders only.
  - Use `parent_folder_id` plus `mode="children"` to emulate folder listing like `ls`.
  - Use `recursive=true` when the folder may contain nested subfolders rather than direct files.
  - Use `diagnostics=true` when a folder should contain files but listing comes back empty; this returns parent resolution details.
  - Use `exact_name=true` when the user gives a precise file or folder name.
requires_oauth: true
oauth_provider_name: GoogleDrive
connectors:
  - connector_id: google_drive
    required: true
actions:
  - name: search
    description: Search or list Google Drive files with ls-style filters such as folders-only or children of a folder.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search text for matching file names or content metadata. Optional when using list mode.
        mode:
          type: string
          enum: [search, list, children]
          description: search=full-text search, list=list visible files, children=list direct children of a folder.
        entry_type:
          type: string
          enum: [any, files, folders]
          description: Restrict results to files only or folders only.
        parent_folder_id:
          type: string
          description: Restrict search/list to direct children of this folder id.
        exact_name:
          type: boolean
          description: Match file names exactly instead of full-text search.
        recursive:
          type: boolean
          description: For mode=children, recursively traverse nested folders until enough matching results are found.
        diagnostics:
          type: boolean
          description: Include parent resolution and traversal diagnostics in the response.
        page_size:
          type: integer
          description: Number of results to return (1-20, default 10).
        mime_type:
          type: string
          description: Optional mime type filter, for example application/pdf.
        order_by:
          type: string
          enum: [modifiedTime desc, modifiedTime asc, name, name desc, createdTime desc, createdTime asc]
          description: Result ordering. Defaults to modifiedTime desc.
        include_trashed:
          type: boolean
          description: Include trashed files in results. Defaults to false.
    handler: actions:search
  - name: read
    description: Read supported Google Drive files including Google Docs, text-like files, and PDFs.
    input_schema:
      type: object
      properties:
        file_id:
          type: string
          description: Google Drive file id to read.
      required: [file_id]
    handler: actions:read
  - name: create
    description: Create a UTF-8 text file, a Google Doc by plain-text import, or a folder. Returns the created entry id and metadata.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: File or folder name (nonblank).
        mime_type:
          type: string
          default: text/plain
          description: text/* or application/json, application/xml, application/javascript, application/x-javascript, application/rtf, application/x-sh, application/sql; native Google Docs and folders also supported. Other types rejected.
        content:
          type: string
          description: UTF-8 text, preserved exactly. Omit for an empty file or Doc. Not allowed for folders, even if empty.
        description:
          type: string
          description: Optional Drive description.
        parent_folder_id:
          type: string
          minLength: 1
          description: Optional destination folder id; omit to use the Drive default location.
      required: [name]
    handler: actions:create
  - name: update
    aliases: [modify]
    description: Update name/description of an entry or replace the entire content of a stored text-like file. Rejects native Google Docs and binary content replacement.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        file_id:
          type: string
          minLength: 1
          description: Drive entry id to update.
        name:
          type: string
          minLength: 1
          description: New nonblank name; omitted fields remain unchanged.
        description:
          type: string
          description: New description; empty string clears it.
        content:
          type: string
          description: Full replacement UTF-8 text, not an append or partial edit. Empty string clears the text file. Stored MIME type is checked; native files, folders, shortcuts, PDFs, and binaries are rejected.
      required: [file_id]
      anyOf:
        - required: [name]
        - required: [description]
        - required: [content]
    handler: actions:update
  - name: delete
    description: Move a Google Drive file to trash.
    input_schema:
      type: object
      properties:
        file_id:
          type: string
          description: Google Drive file id to move to trash.
      required: [file_id]
    handler: actions:delete
