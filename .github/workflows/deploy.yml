name: Deploy to GitHub Pages

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      bump:
        description: "Frontend version bump (a push to prod is always a patch)"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        run: |
          echo "Validating required secrets..."

          missing_secrets=""

          if [ -z "${{ secrets.VITE_API_BASE_URL }}" ]; then
            missing_secrets="${missing_secrets}  - VITE_API_BASE_URL\n"
          fi

          if [ -n "$missing_secrets" ]; then
            echo "::error::Required secrets are missing. Please add the following secrets in GitHub repository settings (Settings > Secrets and variables > Actions):"
            echo -e "$missing_secrets"
            echo ""
            echo "To add secrets:"
            echo "1. Go to your repository on GitHub"
            echo "2. Click Settings > Secrets and variables > Actions"
            echo "3. Click 'New repository secret'"
            echo "4. Add each missing secret with its value"
            exit 1
          fi

          echo "All required secrets are configured."

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # vitest requires Node ^22.12 || ^24 || >=26; keep this in step with
          # local development, which runs Node 24.
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: |
            spa/yarn.lock
            spa/widget/yarn.lock

      - name: Install SPA dependencies
        working-directory: spa
        run: yarn install --frozen-lockfile

      - name: Install widget dependencies
        working-directory: spa/widget
        run: yarn install --frozen-lockfile

      - name: Run SPA tests
        working-directory: spa
        run: yarn test

      - name: Create environment file
        working-directory: spa
        run: |
          echo "Creating .env.production file..."
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > .env.production
          echo "Environment file created with VITE_API_BASE_URL set"

      - name: Compute frontend version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(scripts/next_version.sh spa "${BUMP:-patch}")"
          echo "Frontend version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build shared chat stream package
        working-directory: spa
        run: ./node_modules/.bin/tsc -p packages/chat-stream-renderer/tsconfig.json

      - name: Build SPA
        working-directory: spa
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Building with VITE_API_BASE_URL configured..."
          yarn build

      - name: Build widget
        working-directory: spa/widget
        run: yarn build

      - name: Stage widget for Pages artifact
        run: |
          mkdir -p spa/dist/widget
          cp -R spa/widget/dist/. spa/dist/widget/

      - name: Publish version file
        run: echo '{"version":"${{ steps.version.outputs.version }}"}' > spa/dist/version.json

      - name: Verify build output
        working-directory: spa
        run: |
          echo "Verifying API URL is embedded in build..."
          if grep -r "undefined/auth" dist/ 2>/dev/null; then
            echo "::error::Build verification failed! Found 'undefined/auth' in build output. The VITE_API_BASE_URL was not properly injected."
            exit 1
          fi

          if grep -r "${{ secrets.VITE_API_BASE_URL }}" dist/ 2>/dev/null | head -1; then
            echo "Build verification passed. API URL is correctly embedded."
          else
            echo "::warning::Could not verify API URL in build output. Please check manually."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: spa/dist

  package_plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [vscode, wordpress, wordpress-ai-search]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        if: matrix.plugin == 'vscode'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: plugins/ide/vscode/innomightlabs-code-assist/yarn.lock

      - name: Package VS Code plugin
        if: matrix.plugin == 'vscode'
        run: scripts/downloads/package_vscode_plugin.sh

      - name: Package WordPress plugin
        if: matrix.plugin == 'wordpress'
        run: scripts/downloads/package_wordpress_plugin.sh

      - name: Test plugin downloads pipeline
        if: matrix.plugin == 'wordpress-ai-search'
        run: python3 -m unittest discover -s scripts/downloads -v

      - name: Package WordPress AI Search plugin
        if: matrix.plugin == 'wordpress-ai-search'
        run: scripts/downloads/package_wordpress_ai_search_plugin.sh

      - name: Stage plugin artifact
        run: |
          mkdir -p artifact-root/${{ matrix.plugin }}
          cp -R dist/downloads/${{ matrix.plugin }}/. artifact-root/${{ matrix.plugin }}/

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.plugin }}
          path: artifact-root
          if-no-files-found: error

  publish_plugins:
    runs-on: ubuntu-latest
    needs: package_plugins
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download plugin artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: plugin-*
          path: dist/downloads
          merge-multiple: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
          retry-max-attempts: 3

      - name: Publish plugin downloads
        env:
          ARTIFACTS_BUCKET: innomightlabs-artifacts
          PLUGINS_PREFIX: artifacts/plugins
        run: scripts/downloads/publish_plugins.sh

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # A job's permissions replace the workflow's, so the Pages ones are repeated; contents: write is for the tag.
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Tag the released version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/spa-v${VERSION}" -f sha="${{ github.sha }}"
