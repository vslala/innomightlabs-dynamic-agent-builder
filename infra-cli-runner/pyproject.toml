[project]
name = "infra-cli-runner"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.142.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "hypercorn>=0.18.0",
    "packaging>=25.0",
    "playwright>=1.64.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn[standard]>=0.52.4",
]

# Docling pulls torch. Linux (the Railway image) takes the CPU-only build, which leaves out the CUDA libraries the
# runner has no GPU for; macOS wheels on PyPI are CPU-only already. uv applies sources only to direct dependencies,
# which is why torch and torchvision are listed above.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
