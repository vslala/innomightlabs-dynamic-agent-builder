server {
  listen 80;
  root /usr/share/nginx/html;

  # vite-react-ssg writes /about as about.html and /software/engram as software/engram.html.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
