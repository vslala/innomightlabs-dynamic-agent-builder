    <!-- Invitation secrets must be removed before analytics or external resources. -->
    <script>
      (function () {
        var target = new URL(window.location.href);
        var redirect = target.searchParams.get('redirect');
        if (redirect) {
          try {
            // Older fallbacks may have encoded the path twice. Decode only the
            // path wrapper, not percent escapes inside the invitation token.
            if (/^%2f/i.test(redirect)) redirect = decodeURIComponent(redirect);
            var restored = new URL(redirect, target.origin);
            if (restored.origin === target.origin && restored.pathname.replace(/\/$/, '') === '/invitations/accept') target = restored;
          } catch (_) {}
        }
        if (target.pathname.replace(/\/$/, '') !== '/invitations/accept') return;
        var fragment = new URLSearchParams(target.hash.slice(1));
        var token = fragment.get('token');
        target.hash = '';
        window.history.replaceState(window.history.state, '', target.pathname + target.search);
        if (target.searchParams.get('invitation_storage_error') === '1') return;
        if (token !== null) {
          try {
            window.sessionStorage.setItem('pendingInvitationToken', token);
          } catch (_) {
            try { window.sessionStorage.removeItem('pendingInvitationToken'); } catch (_) {}
            target.searchParams.set('invitation_storage_error', '1');
            window.history.replaceState(window.history.state, '', target.pathname + target.search);
          }
        }
      })();
    </script>

    <!-- SPA redirect handler for GitHub Pages with custom domain -->
    <script>
      (function() {
        // Check for redirect parameter in URL (set by 404.html)
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get('redirect');

        if (redirectPath) {
          // With custom domain, redirect path is the full path
          var newUrl = decodeURIComponent(redirectPath);
          // Replace the URL without the redirect parameter
          history.replaceState(null, '', newUrl);
        }
      })();
    </script>
