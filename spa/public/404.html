<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Cleanup precedes analytics and the fallback URL encoder. -->
  <script>
    (function () {
      var target = new URL(window.location.href);
      if (target.pathname.replace(/\/$/, '') !== '/invitations/accept') return;
      var token = new URLSearchParams(target.hash.slice(1)).get('token');
      target.hash = '';
      window.history.replaceState(window.history.state, '', target.pathname + target.search);
      if (target.searchParams.get('invitation_storage_error') === '1') return;
      if (token !== null) {
        try {
          window.sessionStorage.setItem('pendingInvitationToken', token);
        } catch (_) {
          try { window.sessionStorage.removeItem('pendingInvitationToken'); } catch (_) {}
          target.searchParams.set('invitation_storage_error', '1');
          window.history.replaceState(window.history.state, '', target.pathname + target.search);
        }
      }
    })();
  </script>
  <title>Redirecting...</title>
  <!-- Google Tag Manager -->
  <script>
    (function (w, d, s, l, i) {
      if (w.location.pathname.replace(/\/$/, '') === '/invitations/accept') return;
      w[l] = w[l] || [];
      w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
      var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s),
        dl = l != "dataLayer" ? "&l=" + l : "";
      j.async = true;
      j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
      f.parentNode.insertBefore(j, f);
    })(window, document, "script", "dataLayer", "GTM-5FKVTWPC");
  </script>
  <!-- End Google Tag Manager -->
  <script>
    // Single Page App redirect for GitHub Pages with custom domain
    // Redirects to index.html with the original path encoded in the URL
    (function() {
      var location = window.location;
      var path = location.pathname;

      // Redirect to root with path info in query string
      var invitation = path.replace(/\/$/, '') === '/invitations/accept';
      var redirectUrl = '/?redirect=' + encodeURIComponent(path + location.search + (invitation ? '' : location.hash));

      location.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe
      src="https://www.googletagmanager.com/ns.html?id=GTM-5FKVTWPC"
      height="0"
      width="0"
      style="display: none; visibility: hidden"
    ></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->
  <p>Redirecting...</p>
</body>
</html>
